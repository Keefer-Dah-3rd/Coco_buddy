<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Embed Test</title>
<style>
  /* A deliberately pushy theme, like some WordPress themes: Coco's stage must not change. */
  * { box-sizing: content-box; }
  body { margin: 0; font-family: Georgia, serif; background: #fff; color: #333; }
  button { background: red !important; padding: 30px; border: 4px solid blue; font-size: 30px; }
  div { margin: 6px; }
  canvas { border: 5px dashed green; }
  .container { max-width: 900px; margin: 40px auto; padding: 0 16px; }
</style>
</head>
<body>
  <div class="container">
    <h1>Semplice-style page</h1>
    <p>Some portfolio text above the module.</p>
    <!-- What goes in the Semplice Code module: -->
    <div data-coco data-height="420"></div>
    <p>Some text below the module.</p>
    <div data-coco data-height="300" data-background="#221D1B" data-wander="false" data-size="90"></div>
  </div>
  <script src="/dist/embed/coco-embed.js" defer></script>
</body>
</html>
